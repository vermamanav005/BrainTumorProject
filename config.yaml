# ============================================================================
# Unified Configuration for Brain Tumor Classification Project
# ============================================================================
#
# This file contains ALL hyperparameters, paths, and settings for reproducibility.
# MODIFY ONLY THIS FILE to change experiment parameters.
#
# Created: December 1, 2025
# Purpose: Ensure consistency across all experiments
#
# ============================================================================

# ----------------------------------------------------------------------------
# PATHS (Windows-compatible)
# ----------------------------------------------------------------------------
paths:
  # Root directory of project (use forward slashes or relative path)
  # For Windows: Use forward slashes (/) instead of backslashes (\)
  project_root: "C:/Users/manav/Documents/GitHub/BrainTumorProject"
  
  # Raw data (original, unmodified)
  # This should point to your BrainDataSet folder containing Training/ and Testing/
  raw_data: "C:/Users/manav/Documents/GitHub/BrainTumorProject/BrainDataSet"
  
  # Preprocessed data (canonical source for ALL experiments)
  preprocessed_data: "C:/Users/manav/Documents/GitHub/BrainTumorProject/preprocessed_canonical"
  
  # Output directories
  checkpoints: "C:/Users/manav/Documents/GitHub/BrainTumorProject/checkpoints"
  results: "C:/Users/manav/Documents/GitHub/BrainTumorProject/results"
  logs: "C:/Users/manav/Documents/GitHub/BrainTumorProject/logs"
  figures: "C:/Users/manav/Documents/GitHub/BrainTumorProject/figures"

# ----------------------------------------------------------------------------
# DATA CONFIGURATION
# ----------------------------------------------------------------------------
data:
  # Class names (in order) - must match folder names in BrainDataSet/Training/ and Testing/
  class_names: ['glioma', 'meningioma', 'notumor', 'pituitary']
  num_classes: 4
  
  # Image preprocessing
  image_size: 224  # Standard for ImageNet pretrained models
  
  # Preprocessing parameters
  preprocessing:
    bilateral_filter:
      d: 2
      sigma_color: 50
      sigma_space: 50
    colormap: "COLORMAP_BONE"  # Medical imaging standard
  
  # Data splits (from Training folder)
  splits:
    train_ratio: 0.72  # 72% for training
    val_ratio: 0.18    # 18% for validation
    test_ratio: 0.10   # 10% for internal testing
    # Note: Official Testing folder used as held-out test set
  
  # Data augmentation (training only)
  augmentation:
    enabled: true
    random_horizontal_flip: 0.5
    random_rotation: 10  # degrees
    random_affine:
      translate: [0.05, 0.05]
      scale: null
      shear: null
    color_jitter: null  # Not used for medical images

# ----------------------------------------------------------------------------
# REPRODUCIBILITY
# ----------------------------------------------------------------------------
reproducibility:
  # Random seeds
  seed: 42
  
  # Deterministic settings (slower but reproducible)
  deterministic: true  # Set to false for faster training
  
  # What gets seeded:
  # - Python random
  # - NumPy random
  # - PyTorch CPU
  # - PyTorch CUDA
  # - CuDNN (if deterministic=true)

# ----------------------------------------------------------------------------
# TRAINING CONFIGURATION
# ----------------------------------------------------------------------------
training:
  # Device
  device: "cuda"  # or "cpu", will auto-detect if cuda available
  
  # Batch size
  batch_size: 32
  
  # Number of data loading workers
  num_workers: 0  # Windows: Use 0, Linux/Mac: Use 2-4
  
  # Pin memory for faster GPU transfer
  pin_memory: true
  
  # Training epochs and early stopping
  max_epochs: 100
  early_stopping:
    patience: 7
    min_delta: 0.0001  # Minimum change to qualify as improvement
    monitor: "val_loss"  # or "val_accuracy"
  
  # Mixed precision training
  mixed_precision:
    enabled: true  # 2-3x faster on modern GPUs
    
  # Gradient clipping
  gradient_clipping:
    enabled: true
    max_norm: 1.0

# ----------------------------------------------------------------------------
# OPTIMIZER CONFIGURATION
# ----------------------------------------------------------------------------
optimizer:
  name: "AdamW"  # or "Adam", "SGD"
  
  # Learning rate
  lr: 0.0001  # 1e-4
  
  # Weight decay (L2 regularization)
  weight_decay: 0.01
  
  # AdamW-specific
  betas: [0.9, 0.999]
  eps: 1e-8
  
  # SGD-specific (if using SGD)
  momentum: 0.9
  nesterov: true

# ----------------------------------------------------------------------------
# LEARNING RATE SCHEDULER
# ----------------------------------------------------------------------------
scheduler:
  name: "ReduceLROnPlateau"  # or "CosineAnnealing", "StepLR"
  
  # ReduceLROnPlateau params
  mode: "min"  # minimize val_loss
  factor: 0.3  # LR *= 0.3 on plateau
  patience: 5  # epochs to wait before reducing
  min_lr: 1.0e-7
  verbose: true
  
  # CosineAnnealing params (if using)
  T_max: 50
  eta_min: 1.0e-6

# ----------------------------------------------------------------------------
# LOSS FUNCTION
# ----------------------------------------------------------------------------
loss:
  name: "CrossEntropyLoss"
  
  # Class weights (optional, for imbalanced datasets)
  class_weights: null  # or [1.0, 1.0, 1.0, 1.0]
  
  # Label smoothing (optional)
  label_smoothing: 0.0  # 0.0 = no smoothing

# ----------------------------------------------------------------------------
# DATA TRANSFORMS (Normalization)
# ----------------------------------------------------------------------------
transforms:
  # ImageNet statistics (for pretrained models)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

# ----------------------------------------------------------------------------
# MODEL CONFIGURATIONS
# ----------------------------------------------------------------------------
models:
  # TumorNet-Lite (main model)
  tumornet_lite:
    backbone: "mobilenet_v2"
    pretrained: true  # Use ImageNet pretrained weights
    
    # Novel components
    scta:
      enabled: true
      reduction: 16
    
    apf:
      enabled: true
      out_channels: 256
      dropout: 0.1
    
    pfr:
      enabled: true
    
    # Classifier
    classifier:
      hidden_dim: 256
      dropout: 0.4
  
  # DMFNet (comparison model)
  dmfnet:
    backbone: "mobilenet_v3_large"
    pretrained: true
    shallow_layer_index: 3
    depth_attention_reduction: 16
    fusion_dropout: 0.15
    classifier_dropout: 0.35
  
  # Baseline: ResNet50
  resnet50:
    pretrained: true
    num_layers: 50
    classifier_dropout: 0.5
  
  # Baseline: EfficientNet-B0
  efficientnet_b0:
    pretrained: true
    classifier_dropout: 0.5
  
  # Baseline: MobileNetV2 (plain, no novel components)
  mobilenet_v2_baseline:
    pretrained: true
    classifier_dropout: 0.5

# ----------------------------------------------------------------------------
# EXPERIMENT CONFIGURATIONS
# ----------------------------------------------------------------------------
experiments:
  # Main training run
  main:
    model: "tumornet_lite"
    enabled: true
  
  # Ablation studies
  ablation:
    enabled: true
    variants:
      - name: "no_scta"
        description: "Remove Spatial-Channel Attention"
        config_override:
          models.tumornet_lite.scta.enabled: false
      
      - name: "no_apf"
        description: "Remove Asymmetric Pyramid Fusion"
        config_override:
          models.tumornet_lite.apf.enabled: false
      
      - name: "no_pfr"
        description: "Remove Progressive Feature Refinement"
        config_override:
          models.tumornet_lite.pfr.enabled: false
      
      - name: "backbone_only"
        description: "MobileNetV2 without any novel components"
        model: "mobilenet_v2_baseline"
  
  # Baseline comparisons
  baselines:
    enabled: true
    models:
      - "resnet50"
      - "efficientnet_b0"
      - "dmfnet"
      - "mobilenet_v2_baseline"
  
  # Cross-validation
  cross_validation:
    enabled: false  # Run separately due to time cost
    num_folds: 5
    stratified: true
  
  # Quantization study
  quantization:
    enabled: false
    method: "dynamic"  # or "static"
    dtype: "qint8"

# ----------------------------------------------------------------------------
# EVALUATION METRICS
# ----------------------------------------------------------------------------
evaluation:
  # Metrics to compute
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "confusion_matrix"
    - "roc_auc"
    - "cohen_kappa"
    - "matthews_corrcoef"
  
  # Statistical tests
  statistical_tests:
    enabled: true
    bootstrap:
      n_iterations: 1000
      confidence_level: 0.95
    
    # McNemar's test for paired comparisons
    mcnemar_test:
      enabled: true
      alpha: 0.05

# ----------------------------------------------------------------------------
# VISUALIZATION
# ----------------------------------------------------------------------------
visualization:
  # Figure settings
  dpi: 300  # Publication quality
  format: "png"  # or "pdf", "svg"
  
  # Plots to generate
  plots:
    - "training_curves"
    - "confusion_matrix"
    - "roc_curves"
    - "per_class_metrics"
    - "attention_maps"  # If applicable
  
  # Color schemes
  colors:
    training: "#e74c3c"
    validation: "#3498db"
    palette: "Set2"  # Seaborn palette

# ----------------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------------
logging:
  # Log level
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  
  # Log to file
  log_to_file: true
  log_file: "logs/experiment_{timestamp}.log"
  
  # TensorBoard logging
  tensorboard:
    enabled: false
    log_dir: "logs/tensorboard"
  
  # Weights & Biases logging
  wandb:
    enabled: false
    project: "brain-tumor-classification"
    entity: null  # Your W&B username

# ----------------------------------------------------------------------------
# CHECKPOINTING
# ----------------------------------------------------------------------------
checkpointing:
  # Save best model based on
  monitor: "val_accuracy"  # or "val_loss"
  mode: "max"  # "max" for accuracy, "min" for loss
  
  # Checkpoint naming
  filename_template: "{model}_{experiment}_{timestamp}_epoch{epoch:03d}_acc{val_accuracy:.4f}"
  
  # Keep N best checkpoints
  save_top_k: 3
  
  # Save checkpoint every N epochs (0 = only save best)
  save_every_n_epochs: 0

# ----------------------------------------------------------------------------
# COMPUTATIONAL RESOURCES
# ----------------------------------------------------------------------------
resources:
  # GPU settings
  gpu:
    device_id: 0  # Which GPU to use (if multiple)
    allow_growth: true  # TensorFlow-style memory growth
  
  # CPU settings (if no GPU)
  cpu:
    num_threads: 4  # OpenMP/MKL threads

# ----------------------------------------------------------------------------
# ASSERTIONS & VALIDATION
# ----------------------------------------------------------------------------
validation:
  # Pre-training checks
  pre_training:
    - check_data_exists
    - check_no_data_leakage
    - check_class_balance
    - check_checkpoint_not_exists  # Ensure fresh training
  
  # Post-training checks
  post_training:
    - check_metrics_in_range
    - check_no_nan_weights
    - check_test_untouched  # Ensure test set only used once

# ============================================================================
# END OF CONFIGURATION
# ============================================================================
#
# USAGE:
#   1. Modify this file for experiment configuration
#   2. Load in Python with: config = yaml.safe_load(open('config.yaml'))
#   3. Access values with: config['training']['batch_size']
#   4. Use ${variable} for path substitution
#
# IMPORTANT:
#   - NEVER hardcode hyperparameters in notebooks/scripts
#   - ALL experiments must use this config file
#   - Version control this file with Git
#
# ============================================================================
